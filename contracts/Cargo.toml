[workspace]
resolver = "2"
members = [
    "proof_verifier",
    "risk_policy",
    "rate_calculator",
    "lending_pool",
]

[workspace.dependencies]
soroban-sdk = "25.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
